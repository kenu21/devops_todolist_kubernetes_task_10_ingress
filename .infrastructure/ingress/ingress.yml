apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-ingress
  namespace: todoapp
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - http:
      paths:
      - pathType: ImplementationSpecific
        path: "/(.*)"
        backend:
          service:
            name: todoapp-service
            port:
              number: 80
